<script>
  (function () {
    var p = location.pathname, to = '/', m = p.match(/revelation_study_chapter(\d{1,2})\.html$/);

    else if (/timeline\.html$/.test(p)) to = '/timeline';
    else if (/revelation_chapter1\.pdf$/.test(p)) to = '/revelation-1.pdf';
    location.replace('https://revstudy.sathwiksangeetham.com' + to);
  })();
</script>
